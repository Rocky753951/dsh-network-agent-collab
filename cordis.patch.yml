- insert:
    - id: network-agent-collab
      name: dsh-network-agent-collab
      config:
        mode: lan
        relayUrl: ws://127.0.0.1:8787
        roomId: default
        # Identity, pairing secret, room and transport are created locally by the first-run wizard.
        # These legacy values are accepted for migrations but are never required to activate.
        agentName: dsh-agent
        capabilities: [chat, tasks, messages]
        # Empty disables privileged approval; list only host ids permitted to decide it.
        privilegedApproverIds: []
        # Enabled by default: approved inbound requests create a local DSH agent.
        activationRuntime:
          enabled: true
          # Optional agent loop overrides: { provider: ..., model: ..., maxTokens: ... }
          agentOptions: {}
        # Loopback-only bridge used by the DSH graphical collaboration center.
        ui:
          enabled: true
          port: 8788
